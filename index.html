<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maamoun & Aycha</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Montserrat;
overflow-x:hidden;
color:white;
background:
radial-gradient(circle at 20% 20%, rgba(255,215,150,.22), transparent 35%),
radial-gradient(circle at 80% 70%, rgba(180,0,0,.28), transparent 40%),
linear-gradient(145deg,#220707,#050000);
}

body::before{
content:"";
position:fixed;
inset:0;
background:radial-gradient(circle at 50% 0%, rgba(255,215,150,.18), transparent 45%);
animation:moveGlow 10s infinite alternate;
pointer-events:none;
z-index:0;
}

@keyframes moveGlow{
from{transform:translateY(0)}
to{transform:translateY(80px)}
}

/* INTRO */
.intro{
height:100vh;
display:grid;
place-items:center;
z-index:10;
}

.envelope{
width:90vw;
max-width:380px;
height:240px;
background:linear-gradient(145deg,#fff8ee,#e6d4b5);
border-radius:16px;
position:relative;
box-shadow:0 40px 120px rgba(0,0,0,.9);
}

.flap{
position:absolute;
width:100%;
height:55%;
background:#e6d4b5;
clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;
transition:1.2s;
}

.seal{
position:absolute;
width:90px;
height:90px;
background:radial-gradient(circle,#ff3b2f,#900000);
border-radius:50%;
display:grid;
place-items:center;
color:white;
font-family:'Great Vibes';
font-size:30px;
top:50%;
left:50%;
transform:translate(-50%,-50%);
cursor:pointer;
box-shadow:0 0 50px rgba(255,0,0,.9);
animation:pulse 1.8s infinite;
}

@keyframes pulse{
50%{transform:translate(-50%,-50%) scale(1.1)}
}

.tap{
position:absolute;
bottom:-50px;
width:100%;
text-align:center;
font-size:12px;
color:#e5c777;
letter-spacing:2px;
}

.open .flap{transform:rotateX(180deg)}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.3)}

.website{
display:none;
position:relative;
z-index:2;
}

/* LAYOUT */
.container{
max-width:760px;
margin:auto;
padding:30px 20px 60px;
position:relative;
}

/* INVITE */
.invite{
padding:40px 0 20px;
display:flex;
justify-content:center;
position:relative;
}

.invite-box{
width:100%;
background:rgba(30,10,10,.68);
backdrop-filter:blur(15px);
border-radius:32px;
padding:42px 25px;
text-align:center;
border:1px solid rgba(255,215,150,.45);
box-shadow:0 0 70px rgba(255,0,0,.45);
}

.names{
font-family:'Great Vibes';
font-size:90px;
text-shadow:0 0 25px red;
}

.and{
color:#ffd98a;
font-size:32px;
margin:14px 0;
}

.date{
font-size:34px;
color:#ffd98a;
margin-top:20px;
}

.info{
margin-top:12px;
line-height:1.8;
}

/* SECTIONS */
.lux-section{
padding:25px 0;
display:flex;
justify-content:center;
position:relative;
}

.lux-box{
width:100%;
padding:28px 22px;
border-radius:30px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,215,150,.35);
backdrop-filter:blur(12px);
box-shadow:0 0 45px rgba(255,0,0,.25);
}

.lux-box h2{
font-family:'Great Vibes';
font-size:64px;
color:#ffd98a;
}

.lux-box p{
margin-top:12px;
line-height:1.7;
}

/* BUTTONS */
.btn{
display:block;
padding:14px;
border-radius:30px;
text-align:center;
margin-top:15px;
text-decoration:none;
font-weight:600;
}

.btn.yes{
background:linear-gradient(135deg,#ffd98a,#b8862b);
color:#1e0707;
}

.btn.no{
background:rgba(255,255,255,.1);
color:white;
}

/* POLAROIDS */
.polaroid{
position:absolute;
width:120px;
background:white;
padding:6px;
border-radius:10px;
opacity:0;
transition:1s;
}

.polaroid.left{left:-40px}
.polaroid.right{right:-40px}

.polaroid.show{
opacity:1;
transform:translateY(0);
}

.polaroid img{
width:100%;
height:120px;
object-fit:cover;
}

/* MOBILE */
@media(max-width:768px){

.container{
padding:25px 16px 55px;
}

.lux-box{
width:100%;
}

.polaroid{
width:85px;
}

.polaroid.left{left:8px}
.polaroid.right{right:8px}

}
</style>
</head>

<body>

<div class="intro" id="intro">
<div class="envelope" id="envelope">
<div class="flap"></div>
<div class="seal" id="seal">Love</div>
<div class="tap">TAP TO OPEN</div>
</div>
</div>

<div class="website" id="website">
<div class="container">

<section class="invite">
<div class="invite-box">
<div class="names">Maamoun</div>
<div class="and">&</div>
<div class="names">Aycha</div>
<div class="date">10 / 7 / 2026</div>
<div class="info">Rmeileh Resort & Hotel<br>8:00 PM<br>No Kids</div>
</div>
</section>

<section class="lux-section">
<div class="lux-box">
<h2>Our Night</h2>
<p>Celebration by the sea.</p>
</div>
</section>

<section class="lux-section">
<div class="lux-box">
<h2>Will You Join Us?</h2>
<a class="btn yes" href="https://wa.me/96178960826">Yes</a>
<a class="btn no" href="https://wa.me/96178960826">No</a>
</div>
</section>

<section class="lux-section">
<div class="lux-box">
<h2>See You There</h2>
<p>We can’t wait to celebrate.</p>
<a class="btn yes" href="#">Open Location</a>
</div>
</section>

</div>
</div>

<script>
document.getElementById("seal").onclick=()=>{
document.getElementById("envelope").classList.add("open");
setTimeout(()=>{
document.getElementById("intro").style.display="none";
document.getElementById("website").style.display="block";
},1200);
}
</script>

</body>
</html>
