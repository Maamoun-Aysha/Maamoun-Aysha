<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maamoun & Aycha</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Montserrat;
overflow-x:hidden;
color:white;

/* 🔥 LUXURY BACKGROUND */
background:
radial-gradient(circle at 20% 30%, rgba(255,180,120,.15), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(255,0,0,.18), transparent 40%),
linear-gradient(145deg,#140404,#000000);
}

/* ✨ subtle moving glow */
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 50% 0%, rgba(255,215,150,.25), transparent 50%);
animation:moveGlow 12s infinite alternate;
pointer-events:none;
}

@keyframes moveGlow{
0%{transform:translateY(0)}
100%{transform:translateY(60px)}
}

/* INTRO */
.intro{
height:100vh;
display:grid;
place-items:center;
}

.envelope{
width:90vw;
max-width:380px;
height:240px;
background:linear-gradient(145deg,#fff8ee,#e6d4b5);
border-radius:16px;
position:relative;
overflow:hidden;
box-shadow:0 40px 120px rgba(0,0,0,.9);
}

.flap{
position:absolute;
width:100%;
height:55%;
background:#e6d4b5;
clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;
transition:1.2s;
}

.seal{
position:absolute;
width:90px;
height:90px;
background:radial-gradient(circle,#ff3b2f,#900000);
border-radius:50%;
display:grid;
place-items:center;
color:white;
font-family:'Great Vibes';
font-size:30px;
top:50%;
left:50%;
transform:translate(-50%,-50%);
cursor:pointer;
box-shadow:0 0 50px rgba(255,0,0,.9);
animation:pulse 1.8s infinite;
}

@keyframes pulse{
50%{transform:translate(-50%,-50%) scale(1.1)}
}

.open .flap{transform:rotateX(180deg)}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.3)}

.tap{
position:absolute;
bottom:-50px;
width:100%;
text-align:center;
font-size:12px;
color:#e5c777;
letter-spacing:2px;
}

/* MAIN */
.website{display:none}

/* CENTER INVITE */
.container{
max-width:720px;
margin:auto;
padding:40px 20px;
position:relative;
z-index:2;
}

.invite{
background:rgba(30,10,10,.6);
backdrop-filter:blur(14px);
border-radius:30px;
padding:40px 25px;
text-align:center;
border:1px solid rgba(255,215,150,.4);
box-shadow:
0 0 60px rgba(255,0,0,.5),
inset 0 0 40px rgba(255,215,150,.1);
}

.names{
font-family:'Great Vibes';
font-size:90px;
text-shadow:
0 0 20px red,
0 0 50px rgba(255,200,100,.4);
}

.and{color:#ffd98a;font-size:30px;margin:10px 0}

.date{
font-family:Playfair Display;
font-size:36px;
color:#ffd98a;
margin-top:15px;
}

.info{
margin-top:10px;
line-height:1.8;
color:#fff3dc;
}

/* COUNTDOWN */
.countdown{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:25px;
}

.time-box{
background:rgba(255,255,255,.08);
padding:12px;
border-radius:12px;
border:1px solid rgba(255,215,150,.2);
}

.time-box span{
display:block;
font-size:20px;
color:#ffd98a;
}

/* RSVP */
.rsvp{
margin-top:40px;
padding:30px 20px;
border-radius:25px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,215,150,.3);
box-shadow:0 0 40px rgba(255,0,0,.3);
}

.rsvp h2{
font-family:'Great Vibes';
font-size:55px;
color:#ffd98a;
}

.rsvp p{
margin-top:10px;
font-size:14px;
color:#fff1d8;
}

.rsvp-buttons{
margin-top:20px;
display:flex;
flex-direction:column;
gap:12px;
}

.btn{
padding:14px;
border-radius:30px;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.btn.yes{
background:linear-gradient(135deg,#ffd98a,#b8862b);
color:#1e0707;
box-shadow:0 0 25px rgba(255,200,100,.6);
}

.btn.no{
background:rgba(255,255,255,.1);
color:white;
border:1px solid rgba(255,215,150,.3);
}

.btn:hover{transform:scale(1.06)}

/* POLAROIDS */
.polaroid{
position:absolute;
width:140px;
background:white;
color:black;
padding:8px;
border-radius:10px;
box-shadow:0 20px 50px rgba(0,0,0,.9);
opacity:0;
transform:translateY(120px) scale(.8);
transition:1s ease;
}

.polaroid img{
width:100%;
height:140px;
object-fit:cover;
}

.polaroid span{
display:block;
text-align:center;
margin-top:6px;
font-family:'Great Vibes';
font-size:22px;
}

/* positions */
.left{left:-60px}
.right{right:-60px}

.p1{top:200px}
.p2{top:500px}
.p3{top:800px}
.p4{top:1100px}
.p5{top:1400px}

.polaroid.show{
opacity:1;
transform:translateY(0) scale(1) rotate(var(--r));
}

/* ✨ FLOATING PARTICLES */
.sparkle{
position:fixed;
width:4px;
height:4px;
background:#ffd98a;
border-radius:50%;
box-shadow:0 0 10px #ffd98a;
pointer-events:none;
animation:float 4s linear forwards;
}

@keyframes float{
to{
transform:translateY(-120px);
opacity:0;
}
}

/* MOBILE */
@media(max-width:768px){
.polaroid{width:110px}
.polaroid img{height:110px}
.left{left:-40px}
.right{right:-40px}
}

</style>
</head>

<body>

<div class="intro" id="intro">
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="seal" id="seal">Love</div>
    <div class="tap">TAP TO OPEN</div>
  </div>
</div>

<div class="website" id="website">

<div class="container">

<div class="invite">
<div class="names">Maamoun</div>
<div class="and">&</div>
<div class="names">Aycha</div>

<div class="date">10 / 7 / 2026</div>

<div class="info">
Rmeileh Resort & Hotel<br>
8:00 PM<br>
Adults Only · No Kids
</div>

<div class="countdown">
<div class="time-box"><span id="days">00</span>Days</div>
<div class="time-box"><span id="hours">00</span>Hours</div>
<div class="time-box"><span id="minutes">00</span>Minutes</div>
<div class="time-box"><span id="seconds">00</span>Seconds</div>
</div>

<div class="rsvp">
<h2>Will You Be Joining Us?</h2>
<p>Let us know if you’ll celebrate with us 💌</p>

<div class="rsvp-buttons">
<a class="btn yes"
href="https://wa.me/96178960826?text=I%20am%20coming%20to%20your%20wedding%20❤️"
target="_blank">
Yes, I’m Coming 🎉
</a>

<a class="btn no"
href="https://wa.me/96178960826?text=Unfortunately%20I%20can’t%20make%20it%20💔"
target="_blank">
Can’t Make It
</a>
</div>
</div>

</div>

<!-- POLAROIDS -->
<div class="polaroid left p1" style="--r:-8deg">
<img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486">
<span>Beginning</span>
</div>

<div class="polaroid right p2" style="--r:6deg">
<img src="https://images.unsplash.com/photo-1519741497674-611481863552">
<span>Moments</span>
</div>

<div class="polaroid left p3" style="--r:-5deg">
<img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc">
<span>Love</span>
</div>

<div class="polaroid right p4" style="--r:7deg">
<img src="https://images.unsplash.com/photo-1606800052052-a08af7148866">
<span>Promise</span>
</div>

<div class="polaroid left p5" style="--r:-6deg">
<img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e">
<span>Forever</span>
</div>

</div>
</div>

<script>
const seal=document.getElementById("seal")
const envelope=document.getElementById("envelope")
const intro=document.getElementById("intro")
const website=document.getElementById("website")

seal.onclick=()=>{
envelope.classList.add("open")
setTimeout(()=>{
intro.style.display="none"
website.style.display="block"
},1200)
}

/* countdown */
const weddingDate=new Date("2026-07-10T20:00:00").getTime()

setInterval(()=>{
let now=new Date().getTime()
let d=weddingDate-now

document.getElementById("days").innerText=Math.floor(d/(1000*60*60*24))
document.getElementById("hours").innerText=Math.floor((d/(1000*60*60))%24)
document.getElementById("minutes").innerText=Math.floor((d/(1000*60))%60)
document.getElementById("seconds").innerText=Math.floor((d/1000)%60)
},1000)

/* reveal */
const polaroids=document.querySelectorAll(".polaroid")
const obs=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){e.target.classList.add("show")}
})
},{threshold:0.2})
polaroids.forEach(p=>obs.observe(p))

/* sparkles */
function sparkle(){
const s=document.createElement("div")
s.className="sparkle"
s.style.left=Math.random()*window.innerWidth+"px"
s.style.top=Math.random()*window.innerHeight+"px"
document.body.appendChild(s)
setTimeout(()=>s.remove(),4000)
}
setInterval(sparkle,200)
</script>

</body>
</html>
