<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maamoun & Aycha</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0a0a0a;
    font-family: 'Playfair Display', serif;
    overflow-x: hidden;
}

/* ===== INTRO SCREEN ===== */
.intro {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
    position: relative;
}

/* Envelope background */
.envelope {
    width: 90%;
    max-width: 350px;
    height: 220px;
    background: #f5f1ea;
    border-radius: 10px;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    overflow: hidden;
}

/* Top flap */
.flap {
    position: absolute;
    top: 0;
    width: 100%;
    height: 50%;
    background: #e8e2d8;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition: transform 1s ease;
    z-index: 3;
}

/* Wax seal */
.seal {
    position: absolute;
    width: 80px;
    height: 80px;
    background: radial-gradient(circle, #ff3b3b, #b30000);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-family: 'Great Vibes', cursive;
    font-size: 22px;
    cursor: pointer;
    z-index: 5;
    box-shadow: 0 5px 20px rgba(255,0,0,0.5);
    transition: 0.3s;
}

.seal:hover {
    transform: translate(-50%, -50%) scale(1.1);
}

/* Hidden main content */
.main-content {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: 1s;
    padding: 20px;
}

/* Reveal state */
.open .flap {
    transform: rotateX(180deg);
}

.open .seal {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
}

.open + .main-content {
    opacity: 1;
    pointer-events: all;
}

/* Wedding text */
.names {
    font-family: 'Great Vibes', cursive;
    font-size: 48px;
    margin-bottom: 20px;
}

.details {
    font-size: 18px;
    opacity: 0.8;
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro" id="intro">
    <div class="envelope" id="envelope">
        <div class="flap"></div>
        <div class="seal" id="seal">Love</div>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content" id="mainContent">
    <div>
        <div class="names">Maamoun & Aycha</div>
        <div class="details">
            July 10, 2026 <br>
            Rmeileh Resort & Hotel <br><br>
            8:00 PM <br>
            Adults Only
        </div>
    </div>
</div>

<script>
const seal = document.getElementById("seal");
const envelope = document.getElementById("envelope");
const intro = document.getElementById("intro");

seal.addEventListener("click", () => {
    envelope.classList.add("open");

    setTimeout(() => {
        intro.style.display = "none";
        document.getElementById("mainContent").style.opacity = "1";
    }, 1200);
});
</script>

</body>
</html>
